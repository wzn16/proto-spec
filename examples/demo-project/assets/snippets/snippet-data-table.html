<!--
  【片段】snippet-data-table · 数据表格（c-table）
  【用途】订单列表等业务列表页的主体表格。
  【变体】c-table__th 表头单元格（可加排序标记）；金额列 c-table__num u-num 右对齐数字；
          行内状态用 c-tag（c-tag--success 已完成 / c-tag--warning 待审核 / c-tag--error 已取消）；
          行操作用 c-btn c-btn--text。
  【子元素】必选：thead（列头行）+ tbody（数据行）；可选：更多 tbody 行。
  【可改范围】只改列头与单元格内容；可增删 tbody 行；禁改类名与结构，禁加内联样式。
-->

      <th class="c-table__th">下单时间</th>
      <th class="c-table__th">操作</th>
    </tr>
  </thead>
  <tbody>
    <tr>

        <a class="c-btn c-btn--text" href="order-detail.html">查看</a>
