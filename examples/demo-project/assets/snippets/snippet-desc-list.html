<!--
  【片段】snippet-desc-list · 描述列表（c-desc）
  【用途】详情页（如订单详情）的字段键值对展示。
  【变体】c-desc 描述列表；c-desc__item 单条键值对。
  【子元素】必选：c-desc__item 内含 c-desc__label（字段名）+ c-desc__value（字段值）。
  【可改范围】改字段名与值；可增删 c-desc__item；值内可嵌 c-tag 表状态；禁改类名与结构，禁加内联样式。
-->
