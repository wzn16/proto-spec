<!--
  【片段】snippet-feedback · 操作反馈（c-alert + c-tag）
  【用途】页面顶部/表单上方的操作结果提示，与行内状态标签。
  【变体】c-alert--success 成功 / c-alert--warning 警告 / c-alert--error 错误 / c-alert--info 信息；
          c-tag--success 成功 / c-tag--warning 警告 / c-tag--error 错误。
  【子元素】c-alert 为单条文本提示，无必选子元素；c-tag 为行内标签。
  【可改范围】改文案；可增删 alert 与 tag；禁改类名与结构，禁加内联样式。
-->
<div class="c-alert c-alert--success">订单 SO20261022001 已完成，可发起开票与结算。</div>
<div class="c-alert c-alert--warning">订单 SO20261021008 待审核，请及时处理，超 48 小时将自动退回。</div>
<div class="c-alert c-alert--error">订单 SO20261020015 已取消，货款 ¥23,400.00 将原路退回客户账户。</div>
<div class="c-alert c-alert--info">系统将于今晚 23:00 至 23:30 升级维护，期间暂停下单。</div>
<div class="u-flex u-gap-md">
  <span class="c-tag c-tag--success">已完成</span>
  <span class="c-tag c-tag--warning">待审核</span>
  <span class="c-tag c-tag--error">已取消</span>
</div>
