<!--
  【片段】snippet-modal · 弹窗（c-modal）
  【用途】删除确认、取消订单等需要二次确认的浮层。
  【变体】c-modal 弹窗外壳（默认 hidden，由脚本移除 hidden 显示）；
          内部结构 c-modal__dialog / c-modal__header / c-modal__body / c-modal__footer。
  【子元素】必选：c-modal__dialog（含 role="dialog"）；可选：__header（标题 + 关闭按钮）、__body、__footer。
  【可改范围】改标题、正文、按钮文案；开关 hidden 控制显隐；禁改类名与结构，禁加内联样式。
  【触发示例】在页面放一个触发按钮，由页面脚本联动打开本弹窗：
    <button class="c-btn" type="button" data-action="open-modal" data-target="#demo-modal">取消订单</button>
-->
<div class="c-modal" id="demo-modal" hidden>
  <div class="c-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="demo-modal-title">
    <div class="c-modal__header">
      <h3 id="demo-modal-title">取消订单确认</h3>
      <button class="c-btn c-btn--text" type="button" data-action="close-modal" aria-label="关闭">×</button>
    </div>
    <div class="c-modal__body">
      <p>确定取消订单 SO20261022001（杭州恒晟机械有限公司，¥12,800.00）吗？取消后货款将原路退回，该操作不可恢复。</p>
    </div>
    <div class="c-modal__footer">
      <button class="c-btn c-btn--secondary" type="button" data-action="close-modal">再想想</button>
      <button class="c-btn c-btn--danger" type="button">确认取消</button>
    </div>
  </div>
</div>
