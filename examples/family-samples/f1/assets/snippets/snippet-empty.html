<!--
  【片段】snippet-empty · 空状态（c-empty）
  【用途】列表无数据、搜索无结果时的占位提示。
  【变体】c-empty 空状态容器（单变体，靠文案区分场景）。
  【子元素】必选：图形区 c-empty__icon（内联 SVG，描边继承 currentColor）+ c-empty__title + c-empty__desc；
          可选：动作按钮（c-btn）。
  【可改范围】改标题、描述文案与按钮文案；可换 SVG 图形（保持 stroke="currentColor"）；禁改类名与结构，禁加内联样式。
-->
<div class="c-empty">
  <div class="c-empty__icon">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 28 V10 H38 V28"></path>
      <path d="M6 28 H16 L20 34 H28 L32 28 H42 V40 H6 Z"></path>
    </svg>
  </div>
  <p class="c-empty__title">暂无符合条件的订单</p>
  <p class="c-empty__desc">当前筛选条件下没有订单记录，可调整筛选条件或直接新建订单。</p>
  <a class="c-btn" href="order-list.html">返回列表</a>
</div>
