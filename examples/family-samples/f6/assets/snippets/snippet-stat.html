<!--
  【片段】snippet-stat · 指标卡（c-stat）
  【用途】工作台、列表页顶部的关键指标展示（订单总数、销售额等）。
  【变体】c-stat 默认指标卡；数值涨跌修饰 c-stat__delta--up / c-stat__delta--down。
  【子元素】必选：c-stat__label（指标名）+ c-stat__value（指标值）；可选：c-stat__delta（涨跌说明，加 --up / --down）。
  【可改范围】改数值与文案；可增删指标卡；多卡横排时外包 <div class="u-flex u-gap-md">；禁改类名与结构，禁加内联样式。
-->
<div class="u-flex u-gap-md">
  <div class="c-stat">
    <p class="c-stat__label">订单总数</p>
    <p class="c-stat__value">128</p>
    <p class="c-stat__delta c-stat__delta--up">本周 +12 单</p>
  </div>
  <div class="c-stat">
    <p class="c-stat__label">本月销售额</p>
    <p class="c-stat__value u-num">¥86,400.00</p>
    <p class="c-stat__delta c-stat__delta--up">环比 +8.6%</p>
  </div>
  <div class="c-stat">
    <p class="c-stat__label">待审核订单</p>
    <p class="c-stat__value">6</p>
    <p class="c-stat__delta c-stat__delta--down">较昨日 -2 单</p>
  </div>
  <div class="c-stat">
    <p class="c-stat__label">本月已取消</p>
    <p class="c-stat__value">2</p>
    <p class="c-stat__delta c-stat__delta--down">环比 -1 单</p>
  </div>
</div>
