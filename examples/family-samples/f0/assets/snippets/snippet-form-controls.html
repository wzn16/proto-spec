<!--
  【片段】snippet-form-controls · 表单控件（c-field）
  【用途】业务表单（如新建/编辑订单）的输入区：文本框、下拉、多行文本、复选、单选、开关的统一外壳与间距。
  【变体】c-field 默认态；c-field--error 校验错误态（配合 c-field__hint 显示错误提示）；
          控件类：c-input / c-select / c-textarea / c-check / c-radio / c-switch。
  【子元素】必选：c-field__label（标签）+ 控件本体；可选：c-field__hint（说明或错误提示）。
          c-check / c-radio / c-switch 可脱离 c-field 单独使用。
  【可改范围】只改 label、placeholder、hint 文案与控件默认值；可增删整个 c-field；禁改类名与结构，禁加内联样式。
-->
<div class="c-field">
  <label class="c-field__label" for="field-customer">客户名称</label>
  <input class="c-input" id="field-customer" type="text" placeholder="请输入客户全称">
  <p class="c-field__hint">需与营业执照名称一致，用于合同与发票抬头</p>
</div>
<div class="c-field">
  <label class="c-field__label" for="field-status">订单状态</label>
  <select class="c-select" id="field-status">
    <option value="pending">待审核</option>
    <option value="done" selected>已完成</option>
    <option value="canceled">已取消</option>
  </select>
</div>
<div class="c-field">
  <label class="c-field__label" for="field-remark">备注</label>
  <textarea class="c-textarea" id="field-remark" rows="3" placeholder="请输入备注，如发货与安装要求"></textarea>
</div>
<div class="c-field">
  <span class="c-field__label">支付方式</span>
  <label class="c-radio"><input type="radio" name="pay-method" value="online" checked> 在线支付</label>
  <label class="c-radio"><input type="radio" name="pay-method" value="cod"> 货到付款</label>
</div>
<div class="u-flex u-gap-md">
  <label class="c-check"><input type="checkbox" name="need-invoice" value="1" checked> 需要发票</label>
  <label class="c-switch"><input type="checkbox" name="auto-audit" value="1" checked> 开启自动审核</label>
</div>
