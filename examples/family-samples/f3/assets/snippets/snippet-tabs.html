<!--
  【片段】snippet-tabs · 标签页（c-tabs）
  【用途】详情页内多区块切换，如订单详情的基本信息 / 商品明细 / 操作日志。
  【变体】c-tabs 标签栏；c-tabs__tab 页签，当前页加 c-tabs__tab--active；c-tabs__panel 内容面板（非当前面板加 hidden）。
  【子元素】必选：c-tabs 内若干 c-tabs__tab（带 data-action="switch-tab" 与 data-target 指向面板 id）；
          对应若干 c-tabs__panel；当前页签加 aria-selected="true"。
  【可改范围】改页签名与面板内容；可增删页签（页签与面板一一对应）；禁改类名与结构，禁加内联样式。
-->
<div class="c-tabs" role="tablist">
  <div class="c-tabs__tab c-tabs__tab--active" role="tab" aria-selected="true" data-action="switch-tab" data-target="#tab-basic">基本信息</div>
  <div class="c-tabs__tab" role="tab" aria-selected="false" data-action="switch-tab" data-target="#tab-goods">商品明细</div>
  <div class="c-tabs__tab" role="tab" aria-selected="false" data-action="switch-tab" data-target="#tab-log">操作日志</div>
</div>
<div class="c-tabs__panel" id="tab-basic" role="tabpanel">
  <p>订单 SO20261022001：客户杭州恒晟机械有限公司，金额 ¥12,800.00，下单时间 2026-10-22 09:30，当前状态已完成。</p>
</div>
<div class="c-tabs__panel" id="tab-goods" role="tabpanel" hidden>
  <p>CNC 主轴组件 × 2、伺服电机 × 4，含安装调试服务，合计 ¥12,800.00。</p>
</div>
<div class="c-tabs__panel" id="tab-log" role="tabpanel" hidden>
  <ul>
    <li>2026-10-22 09:30 订单创建</li>
    <li>2026-10-22 10:12 审核通过</li>
    <li>2026-10-22 16:40 发货完成</li>
  </ul>
</div>
