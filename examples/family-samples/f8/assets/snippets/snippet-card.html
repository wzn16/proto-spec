<!--
  【片段】snippet-card · 卡片（c-card）

  【子元素】可选：c-card__header（标题区）、c-card__body（内容区）、c-card__footer（操作区）。
  【可改范围】改标题与内容、footer 内按钮文案；可增删卡片；禁改类名与结构，禁加内联样式。
-->
