<!--
  【片段】snippet-page-nav · 页面导航（c-breadcrumb + c-pagination）
  【用途】子页面顶部的面包屑定位，与列表页底部的分页控件。
  【变体】c-breadcrumb 面包屑（当前页不加链接，加 aria-current="page"）；
          c-pagination 分页（c-pagination__item 页码项，当前页加 c-pagination__item--active）。
  【子元素】面包屑：链接项 + 纯文本分隔符 › + 当前页 span；分页：上一页 / 页码 / 下一页，均为链接。
  【可改范围】改文案与链接；改页码数量；禁改类名与结构，禁加内联样式。
-->
